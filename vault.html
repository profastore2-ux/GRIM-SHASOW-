<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIMSHADOW | SECURE VAULT</title>
    <style>
        :root {
            --orange: #FF9F00; 
            --dark: #050505;
            --card-bg: rgba(14, 14, 14, 0.95);
            --red: #ff4444;
        }

        body {
            margin: 0; padding: 0; background-color: var(--dark);
            color: #fff; font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('image_16.png'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow-x: hidden;
        }

        /* ANNOUNCEMENT BAR */
        #alert-bar { display: none; background: var(--red); color: #fff; padding: 12px; text-align: center; font-weight: 900; font-size: 0.8rem; letter-spacing: 2px; position: fixed; top: 0; width: 100%; z-index: 1000; text-transform: uppercase; box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3); }

        /* NAVBAR */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 80px; background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px); position: fixed; top: 40px; width: 100%; z-index: 999;
            border-bottom: 1px solid rgba(255, 159, 0, 0.2); box-sizing: border-box;
        }
        .nav-logo img { height: 40px; cursor: pointer; }

        /* VAULT HEADER & SEARCH */
        .vault-header { padding: 180px 40px 20px 40px; text-align: center; }
        .vault-header h1 { font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; margin: 0; }
        .vault-header span { color: var(--orange); }

        .search-container { max-width: 600px; margin: 30px auto; position: relative; }
        #vault-search {
            width: 100%; padding: 15px 25px; background: #000;
            border: 1px solid #222; color: #fff; border-radius: 50px;
            outline: none; font-size: 0.9rem; transition: 0.3s;
        }
        #vault-search:focus { border-color: var(--orange); box-shadow: 0 0 15px rgba(255, 159, 0, 0.2); }

        /* STORE GRID */
        .container { max-width: 1400px; margin: 0 auto; padding: 20px 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        /* ITEM CARD */
        .item-card { background: var(--card-bg); border: 1px solid #222; border-radius: 8px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; }
        .item-card:hover { border-color: var(--orange); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .img-box { width: 100%; height: 180px; background: #000; overflow: hidden; border-bottom: 1px solid #222; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.3s; }
        .item-card:hover .img-box img { opacity: 1; transform: scale(1.05); }

        .details { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .details h3 { margin: 0 0 10px 0; font-size: 1.1rem; text-transform: uppercase; color: #fff; letter-spacing: 1px; }
        .details p { color: #888; font-size: 0.85rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; }
        
        .author-box { font-size: 0.7rem; color: var(--orange); margin-bottom: 12px; display: block; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

        details { background: #000; padding: 12px; border-radius: 6px; margin-bottom: 20px; cursor: pointer; border: 1px solid #1a1a1a; transition: 0.3s; }
        summary { font-size: 0.8rem; color: #aaa; font-weight: bold; text-transform: uppercase; }
        details p { font-size: 0.8rem !important; color: #bbb !important; margin-top: 10px; border-top: 1px solid #111; padding-top: 10px; line-height: 1.5; }

        .download-btn {
            background: #fff; color: #000; border: none;
            padding: 14px; width: 100%; font-weight: 900;
            text-transform: uppercase; cursor: pointer; transition: 0.3s;
            font-size: 0.85rem; border-radius: 4px; letter-spacing: 1px;
        }
        .download-btn:hover { background: var(--orange); transform: scale(1.02); }

        #loader { text-align: center; padding: 100px; font-weight: bold; color: var(--orange); letter-spacing: 2px; }

        @media (max-width: 800px) { .navbar { padding: 15px 20px; } .grid { grid-template-columns: 1fr; } .vault-header h1 { font-size: 2rem; } }
    </style>
</head>
<body>

    <div id="alert-bar"></div>

    <nav class="navbar">
        <div class="nav-logo" onclick="location.href='index.html'"><img src="image_13.png" alt="GrimShadow"></div>
        <div style="color: var(--orange); font-weight: 900; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;" id="vault-title">LOADING REPOSITORY...</div>
        <button style="background:none; border:1px solid #333; color:#fff; padding:8px 15px; cursor:pointer; font-size: 0.7rem; border-radius: 4px; text-transform: uppercase; font-weight: bold;" onclick="location.href='user-dash.html'">ACCESS TERMINAL</button>
    </nav>

    <div class="vault-header">
        <h1 id="main-title">SECURE <span>VAULT</span></h1>
        <div class="search-container">
            <input type="text" id="vault-search" placeholder="SEARCH ENCRYPTED ASSETS..." onkeyup="searchVault()">
        </div>
    </div>

    <div class="container">
        <div id="loader">ESTABLISHING ENCRYPTED CONNECTION...</div>
        <div class="grid" id="vault-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHFXjdNyaSn83MDv3NwU9d-cT8tJzmWkY",
            authDomain: "grimshadow-hq.firebaseapp.com",
            projectId: "grimshadow-hq",
            storageBucket: "grimshadow-hq.firebasestorage.app",
            messagingSenderId: "849130104157",
            appId: "1:849130104157:web:360c94b263a052ff15f4b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat') || 'SCR'; 
        let attemptCount = 0;

        document.getElementById('vault-title').innerText = `${category} CATEGORY ACCESS`;
        document.getElementById('main-title').innerHTML = `${category} <span>VAULT</span>`;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'access.html'; } 
            else { checkSecurity(user); listenToAlerts(); loadVaultItems(); }
        });

        function listenToAlerts() {
            onSnapshot(doc(db, "settings", "global_alert"), (d) => {
                const bar = document.getElementById('alert-bar');
                if (d.exists() && d.data().active) { bar.innerText = `⚠️ SYSTEM ALERT: ${d.data().message}`; bar.style.display = "block"; } 
                else { bar.style.display = "none"; }
            });
        }

        async function checkSecurity(user) {
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if (userSnap.exists()) {
                if (userSnap.data().accountStatus === 'banned') {
                    alert("CRITICAL SECURITY ALERT: ACCESS REVOKED.");
                    signOut(auth).then(() => window.location.href = 'access.html');
                }
            }
        }

        window.searchVault = () => {
            const term = document.getElementById('vault-search').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(card => {
                const title = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = title.includes(term) ? "flex" : "none";
            });
        };

        function loadVaultItems() {
            const q = query(collection(db, "services"), where("category", "==", category));
            onSnapshot(q, (snapshot) => {
                const grid = document.getElementById('vault-grid');
                if (document.getElementById('loader')) document.getElementById('loader').style.display = 'none';
                grid.innerHTML = "";
                if(snapshot.empty) { grid.innerHTML = `<p style="text-align:center; width:100%; color:#555; padding:40px;">No encrypted assets found.</p>`; return; }

                snapshot.forEach(doc => {
                    const item = doc.data();
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="img-box"><img src="itam-poto.png"></div>
                        <div class="details">
                            <span class="author-box">DEVELOPER: ${item.author || 'GRIMSHADOW'}</span>
                            <h3>${item.name}</h3>
                            <p>${item.description}</p>
                            <details><summary>INSTALLATION MANUAL</summary><p>${item.installManual || 'No instructions.'}</p></details>
                            <button class="download-btn">REQUEST ACCESS</button>
                        </div>`;
                    
                    card.querySelector('button').onclick = () => secureDownload(item.fileId, category, item.name);
                    grid.appendChild(card);
                });
            });
        }

        window.secureDownload = async (fileId, cat, itemName) => {
            const inputKey = prompt(`🛡️ [SECURITY PROTOCOL] ENTER ${cat} MASTER KEY:`);
            if (!inputKey) return;

            const userRef = doc(db, "users", auth.currentUser.uid);
            const userSnap = await getDoc(userRef);
            const userData = userSnap.data();
            const masterKey = userData.keys[cat.toLowerCase()];

            if (inputKey === masterKey) {
                attemptCount = 0;
                alert("✅ ACCESS GRANTED: Dispatching asset to your Secure Terminal...");
                
                // Dashboard එකට දත්ත යැවීම
                await addDoc(collection(db, "user_downloads"), {
                    uid: auth.currentUser.uid,
                    name: itemName,
                    fileId: fileId,
                    timestamp: serverTimestamp()
                });

                window.location.href = 'user-dash.html';
            } else {
                attemptCount++;
                if (attemptCount >= 3) {
                    await updateDoc(userRef, { accountStatus: 'banned' });
                    alert("❌ SECURITY BREACH: TERMINAL LOCKED.");
                    signOut(auth).then(() => window.location.reload());
                } else {
                    alert(`❌ ACCESS DENIED: ATTEMPT ${attemptCount}/3.`);
                }
            }
        };
    </script>
</body>
</html>
