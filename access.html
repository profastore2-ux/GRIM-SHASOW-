<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIMSHADOW | ACCESS PORTAL</title>
    <style>
        :root { --orange: #FF9F00; --dark: #050505; }
        body { 
            margin: 0; padding: 0; background: var(--dark); color: #fff; 
            font-family: 'Inter', sans-serif; display: flex; justify-content: center; 
            align-items: center; height: 100vh; overflow: hidden;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('image_16.png');
            background-size: cover; background-position: center;
        }
        .login-card {
            background: rgba(15, 15, 15, 0.9); padding: 40px; border-radius: 10px;
            border: 1px solid rgba(255, 159, 0, 0.2); width: 100%; max-width: 400px;
            text-align: center; backdrop-filter: blur(10px);
        }
        .login-card img { height: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--orange)); }
        h2 { color: var(--orange); letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; }
        input {
            width: 100%; padding: 15px; margin-bottom: 15px; background: #000;
            border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--orange); box-shadow: 0 0 10px rgba(255, 159, 0, 0.2); }
        .btn {
            width: 100%; padding: 15px; background: var(--orange); color: #000;
            border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .btn:hover { background: #e68e00; box-shadow: 0 0 20px var(--orange); transform: translateY(-2px); }
        .toggle-text { margin-top: 20px; font-size: 0.85rem; color: #888; }
        .toggle-text span { color: var(--orange); cursor: pointer; font-weight: bold; }
        #error-msg { color: #ff4444; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="image_13.png" alt="Logo">
        <h2 id="form-title">Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button class="btn" id="main-btn" onclick="handleAuth()">Access Terminal</button>
        <p id="error-msg"></p>
        <p class="toggle-text" id="toggle-wrapper">
            Don't have an account? <span onclick="toggleForm()">Register Here</span>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHFXjdNyaSn83MDv3NwU9d-cT8tJzmWkY",
            authDomain: "grimshadow-hq.firebaseapp.com",
            projectId: "grimshadow-hq",
            storageBucket: "grimshadow-hq.firebasestorage.app",
            messagingSenderId: "849130104157",
            appId: "1:849130104157:web:360c94b263a052ff15f4b4",
            measurementId: "G-W0LXXE9CHT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let isLogin = true;

        window.toggleForm = () => {
            isLogin = !isLogin;
            document.getElementById('form-title').innerText = isLogin ? 'Login' : 'Register';
            document.getElementById('main-btn').innerText = isLogin ? 'Access Terminal' : 'Create Account';
            document.getElementById('toggle-wrapper').innerHTML = isLogin ? 
                `Don't have an account? <span onclick="toggleForm()">Register Here</span>` : 
                `Already have an account? <span onclick="toggleForm()">Login Here</span>`;
        };

        window.handleAuth = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return;

            try {
                if(isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = 'user-dash.html';
            } catch (error) {
                const errorElement = document.getElementById('error-msg');
                errorElement.innerText = error.message;
                errorElement.style.display = 'block';
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) { window.location.href = 'user-dash.html'; }
        });
    </script>
</body>
</html>
